name: Build HexBox Desktop

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
            artifact_name: hexbox-windows-x64

          - label: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg,app
            artifact_name: hexbox-macos-arm64

          - label: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg,app
            artifact_name: hexbox-macos-x64

          - label: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
            artifact_name: hexbox-linux-x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.label }}

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Setup Python for the OCR runner
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The macos-x64 job cross-compiles on an Apple Silicon runner, where the
      # runner would come out arm64; that build falls back to the Python sidecar.
      - name: Compile standalone OCR runner
        if: matrix.label != 'macos-x64'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ocr-sidecar/requirements.txt pyinstaller
          python scripts/build_ocr_runner.py

      - name: Run Rust workspace unit tests
        run: cargo test --workspace --exclude hexbox-desktop

      - name: Build Tauri desktop bundles
        working-directory: apps/desktop
        env:
          # Avoid FUSE mount failures when creating AppImage on Linux CI runners
          APPIMAGE_EXTRACT_AND_RUN: "1"
          # Ensure CI builds do not fail if optional signing keys are unset
          TAURI_SIGNING_PRIVATE_KEY: ""
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Package Windows portable archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exePath = "target/${{ matrix.target }}/release/hexbox-desktop.exe"
          if (-not (Test-Path $exePath)) {
            throw "Expected Windows binary not found at $exePath"
          }
          $stage = "target/portable-win64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item $exePath "$stage/HexBox.exe"
          if (Test-Path "ocr-sidecar") {
            New-Item -ItemType Directory -Force -Path "$stage/ocr-sidecar" | Out-Null
            Get-ChildItem "ocr-sidecar" -File | Copy-Item -Destination "$stage/ocr-sidecar"
          }
          if (Test-Path "ocr") {
            Copy-Item "ocr" "$stage/ocr" -Recurse -Force
          }
          if (Test-Path "scripts") {
            Copy-Item "scripts" "$stage/scripts" -Recurse -Force
          }
          if (Test-Path "models") {
            New-Item -ItemType Directory -Force -Path "$stage/models" | Out-Null
            Get-ChildItem "models" -File | Copy-Item -Destination "$stage/models"
          }
          New-Item -ItemType Directory -Force -Path "target/release-assets" | Out-Null
          Compress-Archive -Path "$stage/*" -DestinationPath "target/release-assets/HexBox-windows-x64-portable.zip" -Force

      - name: Collect release artifacts
        shell: bash
        run: |
          mkdir -p target/release-assets
          shopt -s nullglob
          for f in \
            target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe \
            target/${{ matrix.target }}/release/bundle/msi/*.msi \
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg \
            target/${{ matrix.target }}/release/bundle/deb/*.deb \
            target/${{ matrix.target }}/release/bundle/rpm/*.rpm \
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage; do
            cp -v "$f" target/release-assets/
          done
          ls -lh target/release-assets/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: target/release-assets/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: List release assets
        run: ls -lh release-artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
