name: Build HexBox Desktop

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
            artifact_name: hexbox-windows-x64

          - label: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg,app
            artifact_name: hexbox-macos-arm64

          - label: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg,app
            artifact_name: hexbox-macos-x64

          - label: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
            artifact_name: hexbox-linux-x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.label }}

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Setup Python for the OCR runner
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The macos-x64 job cross-compiles on an Apple Silicon runner, where the
      # runner would come out arm64; that build falls back to the Python sidecar.
      - name: Compile standalone OCR runner
        if: matrix.label != 'macos-x64'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ocr-sidecar/requirements.txt pyinstaller
          python scripts/build_ocr_runner.py

      # The ONNX models are not in Git; fetch them (SHA-256 checked) from the
      # release listed in scripts/models.lock.json so the bundle can run OCR
      # offline. Tag builds fail without them; other builds only warn.
      - name: Fetch OCR models
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            python scripts/fetch_models.py
          else
            python scripts/fetch_models.py --optional
          fi

      - name: Run Rust workspace unit tests
        run: cargo test --workspace --exclude hexbox-desktop

      - name: Build Tauri desktop bundles
        working-directory: apps/desktop
        shell: bash
        env:
          # Avoid FUSE mount failures when creating AppImage on Linux CI runners
          APPIMAGE_EXTRACT_AND_RUN: "1"
          # Updater signing key (minisign). Generate with
          # `npm run tauri signer generate -w ~/.tauri/hexbox-updater.key`
          # and store the private key + password as repository secrets.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Private backend base URL compiled into release builds (invisible in UI)
          HAXASSISTANT_DATA_SYNC_URL: ${{ secrets.HAXASSISTANT_DATA_SYNC_URL }}
        run: |
          extra=()
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]]; then
            if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
              echo "::error::TAURI_SIGNING_PRIVATE_KEY is required for release builds"
              exit 1
            fi
            echo "::warning::No updater signing key; building without update artifacts"
            extra=(--config '{"bundle":{"createUpdaterArtifacts":false}}')
          fi
          npm run tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} "${extra[@]}"

      - name: Package Windows portable archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exePath = "target/${{ matrix.target }}/release/hexbox-desktop.exe"
          if (-not (Test-Path $exePath)) {
            throw "Expected Windows binary not found at $exePath"
          }
          $stage = "target/portable-win64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item $exePath "$stage/HaxAssistant.exe"
          if (Test-Path "data") {
            New-Item -ItemType Directory -Force -Path "$stage/data" | Out-Null
            $skipData = @(
              "user_settings.json",
              "overlay_layout.json",
              "player_markers.json",
              "player_encounters.json",
              "augment_offer_stats.json"
            )
            Get-ChildItem "data" -File -Filter "*.json" |
              Where-Object { $skipData -notcontains $_.Name } |
              Copy-Item -Destination "$stage/data"
          }
          if (Test-Path "ocr-sidecar") {
            New-Item -ItemType Directory -Force -Path "$stage/ocr-sidecar" | Out-Null
            Get-ChildItem "ocr-sidecar" -File | Copy-Item -Destination "$stage/ocr-sidecar"
          }
          if (Test-Path "ocr") {
            # Copy the contents: `Copy-Item ocr $stage/ocr -Recurse` nests to
            # ocr/ocr/hexbox-ocr.exe when the destination already exists,
            # but app-core resolves ocr/hexbox-ocr.exe.
            New-Item -ItemType Directory -Force -Path "$stage/ocr" | Out-Null
            Copy-Item "ocr/*" "$stage/ocr" -Recurse -Force
            if (-not (Test-Path "$stage/ocr/hexbox-ocr.exe")) {
              throw "portable bundle is missing ocr/hexbox-ocr.exe"
            }
          }
          if (Test-Path "scripts") {
            Copy-Item "scripts" "$stage/scripts" -Recurse -Force
          }
          if (Test-Path "models") {
            New-Item -ItemType Directory -Force -Path "$stage/models" | Out-Null
            Get-ChildItem "models" -File | Copy-Item -Destination "$stage/models"
          }
          New-Item -ItemType Directory -Force -Path "target/release-assets" | Out-Null
          Compress-Archive -Path "$stage/*" -DestinationPath "target/release-assets/HexBox-windows-x64-portable.zip" -Force

      - name: Collect release artifacts
        shell: bash
        run: |
          mkdir -p target/release-assets
          shopt -s nullglob
          for f in \
            target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe \
            target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe.sig \
            target/${{ matrix.target }}/release/bundle/msi/*.msi \
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg \
            target/${{ matrix.target }}/release/bundle/deb/*.deb \
            target/${{ matrix.target }}/release/bundle/rpm/*.rpm \
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage \
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage.sig; do
            cp -v "$f" target/release-assets/
          done
          # macOS updater archive is always named HexBox.app.tar.gz; give each
          # architecture its own name so both fit in one release.
          version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          arch=$([[ "${{ matrix.target }}" == aarch64-* ]] && echo aarch64 || echo x64)
          for f in target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz{,.sig}; do
            base=$(basename "$f")
            cp -v "$f" "target/release-assets/${base/.app.tar.gz/_${version}_${arch}.app.tar.gz}"
          done
          ls -lh target/release-assets/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: target/release-assets/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      # latest.json is what the in-app updater polls
      # (releases/latest/download/latest.json).
      - name: Generate updater manifest
        run: |
          python3 scripts/make_updater_manifest.py release-artifacts \
            --version "${GITHUB_REF_NAME#v}" \
            --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}" \
            --out release-artifacts/latest.json
          cat release-artifacts/latest.json

      - name: List release assets
        run: ls -lh release-artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
