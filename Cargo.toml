[workspace]
resolver = "2"
members = [
  "crates/shared-types",
  "crates/data-runtime",
  "crates/data-updater",
  "crates/reco-engine",
  "crates/lcu-client",
  "crates/app-core",
  "apps/desktop/src-tauri",
]

[workspace.package]
version = "2.1.3"
edition = "2021"

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
flate2 = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tar = "0.4"
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "time", "process", "sync"] }
